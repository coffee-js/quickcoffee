[package]
name = "quickcoffee"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A compact CoffeeScript-inspired bytecode engine"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/coffee-js/quickcoffee"
homepage = "https://github.com/coffee-js/quickcoffee"
documentation = "https://docs.rs/quickcoffee"
keywords = ["coffeescript", "bytecode", "vm", "scripting", "embedding"]
categories = ["compilers", "embedded", "command-line-utilities"]
default-run = "qcoffee"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "quickcoffee"
path = "src/lib.rs"

[dependencies]
cap-std = "4.0.3"
num-bigint = "0.5.1"
num-integer = "0.1.46"
num-traits = "0.2.19"
unicode-ident = "1.0"

[[bin]]
name = "qcoffee"
path = "src/main.rs"

[[bin]]
name = "qdocco"
path = "src/bin/qdocco.rs"

[[bin]]
name = "qtest"
path = "src/bin/qtest.rs"

[[bin]]
name = "qbench"
path = "src/bin/qbench.rs"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "pricing"
harness = false

[[bench]]
name = "normalization"
harness = false

[[bench]]
name = "policy_package"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
